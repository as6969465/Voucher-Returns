<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>禮券退貨彙整平台</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen bg-slate-50">

<div id="operatorModal" class="fixed inset-0 bg-slate-900/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
    <h2 class="text-lg font-bold text-slate-800 mb-1">作業前請輸入代號</h2>
    <p class="text-sm text-slate-400 mb-3">用於在刷入紀錄中標示是哪一台裝置/哪個人操作的</p>
    <input id="operatorCodeInput" type="text" maxlength="20" autofocus
      class="w-full border border-slate-300 rounded-lg px-3 py-2 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
      placeholder="例如：A01、王小明" />
    <div id="operatorCodeError" class="mt-1 text-sm text-red-600 min-h-[1.25rem]"></div>
    <button id="operatorCodeConfirmBtn" class="mt-1 w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-medium py-2 rounded-lg">開始作業</button>
  </div>
</div>

<header class="bg-white border-b border-slate-200 sticky top-0 z-10">
  <div class="w-full px-4 py-2 flex items-center justify-between gap-4">
    <div class="flex items-center gap-2 shrink-0">
      <span class="text-2xl">🎟️</span>
      <h1 class="text-lg font-bold text-slate-800">禮券退貨彙整平台 · 即時歸組模式</h1>
    </div>
    <div class="flex items-center gap-4 text-center">
      <div>
        <div class="text-lg font-bold text-emerald-600" id="scanTotal">0</div>
        <div class="text-xs text-slate-400">有效刷入</div>
      </div>
      <div>
        <div class="text-lg font-bold text-red-500" id="scanErr">0</div>
        <div class="text-xs text-slate-400">格式錯誤</div>
      </div>
      <div>
        <div class="text-lg font-bold text-indigo-600" id="scanGroupCount">0</div>
        <div class="text-xs text-slate-400">群組數</div>
      </div>
      <div>
        <div class="text-lg font-bold text-indigo-600" id="scanSegmentCount">0</div>
        <div class="text-xs text-slate-400">整理數</div>
      </div>
      <div>
        <div class="text-lg font-bold text-slate-700" id="scanCardTotal">0</div>
        <div class="text-xs text-slate-400">總張數</div>
      </div>
    </div>
    <div class="flex items-center gap-3 shrink-0">
      <span id="syncStatus" class="text-sm px-2 py-1 rounded-full bg-slate-100 text-slate-400">連線中...</span>
      <span id="operatorLabel" class="text-sm px-2 py-1 rounded-full bg-indigo-50 text-indigo-600"></span>
      <button id="releaseOperatorBtn" class="text-base text-slate-500 hover:text-red-500">結束作業</button>
    </div>
  </div>
</header>

<main class="w-full px-4 py-3">

  <section id="scanPanel">
    <div class="grid grid-cols-1 lg:grid-cols-[480px_1fr] gap-3">
      <div class="space-y-3">
        <div class="bg-white rounded-xl border border-slate-200 border-l-4 border-l-indigo-500 p-3">
          <label class="flex items-center gap-1.5 text-base font-semibold text-indigo-700 mb-1">
            <span>📷</span><span>逐筆刷入</span>
          </label>
          <input id="scanInput" type="text" autofocus
            class="w-full border border-slate-300 rounded-lg px-3 py-2 text-lg font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"
            placeholder="條碼槍掃描或手動輸入後按 Enter" />
          <div id="feedbackBar" class="mt-1 text-base font-medium h-6"></div>

          <div class="mt-2">
            <label class="flex justify-between items-center text-base font-medium text-slate-600 mb-1">
              <span>容忍值</span>
              <input id="toleranceValue" type="number" min="1" max="200" value="20"
                class="w-16 text-right border border-slate-300 rounded px-1 py-0.5 text-indigo-600 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </label>
            <input id="toleranceSlider" type="range" min="1" max="200" value="20" class="w-full" />
          </div>

          <div class="mt-2">
            <label class="flex justify-between items-center text-base font-medium text-slate-600 mb-1">
              <span>群組序號範圍上限（±）</span>
              <input id="maxGroupSizeValue" type="number" min="1" max="500" value="100"
                class="w-16 text-right border border-slate-300 rounded px-1 py-0.5 text-indigo-600 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            </label>
            <input id="maxGroupSizeSlider" type="range" min="1" max="500" value="100" class="w-full" />
          </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 border-l-4 border-l-amber-500 p-3">
          <label class="flex items-center gap-1.5 text-base font-semibold text-amber-700 mb-1">
            <span>⏩</span><span>連號頭尾過刷</span>
          </label>
          <div class="flex gap-2">
            <input id="rangeFromInput" type="text"
              class="w-1/2 border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"
              placeholder="起始序號" />
            <input id="rangeToInput" type="text"
              class="w-1/2 border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"
              placeholder="結束序號" />
          </div>
          <button id="rangeFillBtn" class="mt-2 w-full bg-amber-500 hover:bg-amber-600 disabled:opacity-50 text-white font-medium py-1.5 rounded-lg text-base">
            帶入中間連號
          </button>
          <div id="rangeFeedback" class="mt-1 text-sm font-medium min-h-[1.25rem]"></div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 p-3">
          <div class="flex items-center justify-between mb-1">
            <div class="text-base font-medium text-slate-600">刷入紀錄</div>
            <label class="flex items-center gap-1.5 text-sm text-slate-500 select-none cursor-pointer">
              <input id="logOnlyMineToggle" type="checkbox" class="w-4 h-4" />
              只看我的
            </label>
          </div>
          <div id="scanLog" class="space-y-0.5 text-xs font-mono max-h-64 overflow-y-auto whitespace-nowrap"></div>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-slate-200 p-3">
        <div class="flex justify-between items-center mb-2">
          <div class="flex gap-1">
            <button id="scanSubTabGroupsBtn" class="scan-sub-tab px-3 py-1.5 text-base font-medium rounded-lg bg-indigo-50 text-indigo-600">群組列表</button>
            <button id="scanSubTabResultBtn" class="scan-sub-tab px-3 py-1.5 text-base font-medium rounded-lg text-slate-500 hover:bg-slate-50">整理結果</button>
            <button id="scanSubTabQueryBtn" class="scan-sub-tab px-3 py-1.5 text-base font-medium rounded-lg text-slate-500 hover:bg-slate-50">過刷卡號查詢</button>
          </div>
          <div class="flex gap-3">
            <button id="sortScanBtn" class="text-base text-indigo-600 hover:underline">排序群組</button>
            <button id="exportExcelBtn" class="text-base text-emerald-600 hover:underline">匯出 Excel</button>
            <button id="resetScanBtn" class="text-base text-red-500 hover:underline">重置</button>
          </div>
        </div>
        <div id="scanGroupsView" class="space-y-2 max-h-[640px] overflow-y-auto"></div>
        <div id="scanResultView" class="hidden max-h-[640px] overflow-y-auto">
          <div class="flex items-center gap-4 mb-2 text-sm text-slate-500">
            <label class="flex items-center gap-1.5 select-none cursor-pointer">
              <input id="jumpOnlyMineToggle" type="checkbox" class="w-4 h-4" />
              只跳轉我自己刷的
            </label>
            <label class="flex items-center gap-1.5 select-none cursor-pointer">
              跳轉底色
              <input id="jumpHighlightColorInput" type="color" value="#a7f3d0" class="w-8 h-6 border border-slate-300 rounded cursor-pointer" />
            </label>
          </div>
          <table class="w-full text-base table-fixed">
            <colgroup>
              <col class="w-16" />
              <col class="w-20" />
              <col class="w-12" />
              <col class="w-32" />
              <col />
              <col />
              <col class="w-20" />
              <col class="w-24" />
              <col class="w-24" />
            </colgroup>
            <thead class="sticky top-0 bg-white">
              <tr class="text-left text-slate-500 border-b border-slate-200">
                <th class="py-2 px-2 text-center whitespace-nowrap">序號</th>
                <th class="py-2 px-2 text-center whitespace-nowrap">群組編號</th>
                <th class="py-2 px-2 text-center whitespace-nowrap">✓</th>
                <th class="py-2 px-2 whitespace-nowrap">前綴</th>
                <th class="py-2 px-2 whitespace-nowrap">第一張序號</th>
                <th class="py-2 px-2 whitespace-nowrap">最後一張序號</th>
                <th class="py-2 px-2 text-right whitespace-nowrap">張數</th>
                <th class="py-2 px-2 whitespace-nowrap">刷入時間</th>
                <th class="py-2 px-2 whitespace-nowrap">人員代號</th>
              </tr>
            </thead>
            <tbody id="scanResultBody"></tbody>
          </table>
        </div>
        <div id="scanQueryView" class="hidden">
          <div class="flex gap-2 mb-3">
            <input id="queryInput" type="text"
              class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-lg font-mono focus:outline-none focus:ring-2 focus:ring-indigo-400"
              placeholder="輸入完整序號查詢屬於哪個群組" />
            <button id="queryBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 rounded-lg text-base">查詢</button>
          </div>
          <div id="queryResult" class="text-base"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="script.js"></script>
<script type="module">
import { db } from "./firebase-config.js";
import {
  doc,
  collection,
  getDocs,
  writeBatch,
  setDoc,
  onSnapshot,
  runTransaction,
  updateDoc,
  arrayUnion,
  arrayRemove,
  serverTimestamp,
} from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

/* ---------- 作業代號：取代帳號密碼登入，唯一識別誰在操作，且不可與目前作業中的人重複 ---------- */
const OPERATOR_STORAGE_KEY = "voucherReturnsOperator";
let operatorCode = sessionStorage.getItem(OPERATOR_STORAGE_KEY) || "";

const operatorModal = document.getElementById("operatorModal");
const operatorCodeInput = document.getElementById("operatorCodeInput");
const operatorCodeConfirmBtn = document.getElementById("operatorCodeConfirmBtn");
const operatorCodeError = document.getElementById("operatorCodeError");
const operatorLabel = document.getElementById("operatorLabel");
const releaseOperatorBtn = document.getElementById("releaseOperatorBtn");

function setOperatorLabel() {
  operatorLabel.textContent = operatorCode ? `代號：${operatorCode}` : "";
}

function setOperatorError(text) {
  operatorCodeError.textContent = text;
}

/** 在共用資料中登記代號；若已有人使用中則失敗 */
async function claimOperatorCode(code) {
  return runTransaction(db, async (tx) => {
    const snap = await tx.get(sessionRef);
    const data = ensureSessionDefaults(snap.exists() ? snap.data() : emptySessionData());
    if (!Array.isArray(data.activeOperators)) data.activeOperators = [];
    if (data.activeOperators.includes(code)) {
      return { ok: false };
    }
    data.activeOperators.push(code);
    tx.set(sessionRef, data);
    return { ok: true };
  });
}

function releaseOperatorCode(code) {
  if (!code) return;
  updateDoc(sessionRef, { activeOperators: arrayRemove(code) }).catch(() => {});
}

async function confirmOperatorCode() {
  const value = operatorCodeInput.value.trim();
  if (!value) {
    setOperatorError("請輸入代號");
    operatorCodeInput.focus();
    return;
  }

  operatorCodeConfirmBtn.disabled = true;
  setOperatorError("");
  try {
    const result = await claimOperatorCode(value);
    if (!result.ok) {
      setOperatorError("此代號目前有人正在作業中，請換一個代號");
      return;
    }
    operatorCode = value;
    sessionStorage.setItem(OPERATOR_STORAGE_KEY, operatorCode);
    setOperatorLabel();
    operatorModal.classList.add("hidden");
    scanInput.focus();
  } catch (err) {
    setOperatorError("送出失敗，請重試");
  } finally {
    operatorCodeConfirmBtn.disabled = false;
  }
}

if (operatorCode) {
  // 同一台裝置重新整理頁面：代號已登記過，不需要再次搶號
  operatorModal.classList.add("hidden");
  setOperatorLabel();
}

operatorCodeConfirmBtn.addEventListener("click", confirmOperatorCode);
operatorCodeInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") confirmOperatorCode();
});

releaseOperatorBtn.addEventListener("click", () => {
  if (!confirm("確定要結束作業並釋放代號嗎？")) return;
  releaseOperatorCode(operatorCode);
  sessionStorage.removeItem(OPERATOR_STORAGE_KEY);
  operatorCode = "";
  setOperatorLabel();
  operatorCodeInput.value = "";
  setOperatorError("");
  operatorModal.classList.remove("hidden");
  operatorCodeInput.focus();
});

window.addEventListener("beforeunload", () => {
  // 盡力而為：關閉分頁時嘗試釋放代號，但無法保證一定送達（例如斷網、瀏覽器直接砍掉行程）
  releaseOperatorCode(operatorCode);
});

/* ---------- 即時歸組模式（Firestore 共用資料，多人同步刷入/檢視） ----------
 * 資料結構（v2，避免單一文件超過 Firestore 1MB 上限）：
 *   sessions/shared                    小型 meta 文件：容忍值/範圍上限/統計/紀錄/核對狀態
 *   sessions/shared/groups/{groupId}   每個群組各自一份文件：{ id, prefix, items }
 *   sessions/shared/seen/{raw}         每張已刷入序號各自一份極小文件，只用來判斷重複
 */
const sessionRef = doc(db, "sessions", "shared");
const groupsCol = collection(db, "sessions", "shared", "groups");
const seenCol = collection(db, "sessions", "shared", "seen");

function emptySessionData() {
  return {
    groupIdCounter: 1,
    totalScanned: 0,
    tolerance: 20,
    maxGroupSize: 100,
    syncedSegments: [],
    log: [],
    activeOperators: [],
    schemaVersion: 2,
  };
}

function ensureSessionDefaults(data) {
  if (!Array.isArray(data.log)) data.log = [];
  if (!Array.isArray(data.syncedSegments)) data.syncedSegments = [];
  if (!Array.isArray(data.activeOperators)) data.activeOperators = [];
  if (typeof data.groupIdCounter !== "number") data.groupIdCounter = 1;
  if (typeof data.totalScanned !== "number") data.totalScanned = 0;
  if (typeof data.tolerance !== "number") data.tolerance = 20;
  if (typeof data.maxGroupSize !== "number") data.maxGroupSize = 100;
  return data;
}

const LOG_MAX_ENTRIES = 100;

// 一律只顯示券種+號碼（最高 15 碼），檢查碼（第 16 碼）永遠不顯示，即使舊資料裡還留著也一樣
function formatRawHtml(item) {
  return `${item.type}${item.batchNo}<span class="text-red-600 font-bold">${item.seqStr}</span>`;
}

let scanGroups = [];       // 本機鏡像：目前所有群組（來自 Firestore groups 子集合即時同步）
let scanTotalCount = 0;    // 本機鏡像：全體有效刷入總數
let scanErrCount = 0;      // 本機統計：格式錯誤為單機計數，不跨裝置同步
let tolerance = 20;        // 本機鏡像：容忍值（由任一使用者調整後同步給所有人）
let maxGroupSize = 100;    // 本機鏡像：單一群組最高可容納張數（由任一使用者調整後同步給所有人）
const syncedSegments = new Map(); // 本機鏡像：整理結果核對狀態
const localGroupMeta = new Map(); // groupId -> itemCount，用來判斷這次同步哪個群組有異動

const scanInput = document.getElementById("scanInput");
const feedbackBar = document.getElementById("feedbackBar");
const toleranceSlider = document.getElementById("toleranceSlider");
const toleranceValue = document.getElementById("toleranceValue");
const maxGroupSizeSlider = document.getElementById("maxGroupSizeSlider");
const maxGroupSizeValue = document.getElementById("maxGroupSizeValue");
const rangeFromInput = document.getElementById("rangeFromInput");
const rangeToInput = document.getElementById("rangeToInput");
const rangeFillBtn = document.getElementById("rangeFillBtn");
const rangeFeedback = document.getElementById("rangeFeedback");
const scanGroupsView = document.getElementById("scanGroupsView");
const scanLog = document.getElementById("scanLog");
const syncStatus = document.getElementById("syncStatus");
const logOnlyMineToggle = document.getElementById("logOnlyMineToggle");
logOnlyMineToggle.addEventListener("change", () => {
  showOnlyMineLog = logOnlyMineToggle.checked;
  renderCombinedLog();
});

let applyingRemoteTolerance = false;
function setToleranceLocal(value) {
  tolerance = Math.min(200, Math.max(1, parseInt(value, 10) || 1));
  toleranceSlider.value = tolerance;
  toleranceValue.value = tolerance;
}
toleranceSlider.addEventListener("input", () => {
  setToleranceLocal(toleranceSlider.value);
  if (applyingRemoteTolerance) return;
  updateDoc(sessionRef, { tolerance }).catch(() => {});
});
toleranceValue.addEventListener("change", () => {
  setToleranceLocal(toleranceValue.value);
  if (applyingRemoteTolerance) return;
  updateDoc(sessionRef, { tolerance }).catch(() => {});
});

let applyingRemoteMaxGroupSize = false;
function setMaxGroupSizeLocal(value) {
  maxGroupSize = Math.min(500, Math.max(1, parseInt(value, 10) || 1));
  maxGroupSizeSlider.value = maxGroupSize;
  maxGroupSizeValue.value = maxGroupSize;
}
maxGroupSizeSlider.addEventListener("input", () => {
  setMaxGroupSizeLocal(maxGroupSizeSlider.value);
  if (applyingRemoteMaxGroupSize) return;
  updateDoc(sessionRef, { maxGroupSize }).catch(() => {});
});
maxGroupSizeValue.addEventListener("change", () => {
  setMaxGroupSizeLocal(maxGroupSizeValue.value);
  if (applyingRemoteMaxGroupSize) return;
  updateDoc(sessionRef, { maxGroupSize }).catch(() => {});
});

function setFeedback(text, colorClass) {
  const bgClass = colorClass.includes("emerald")
    ? "bg-emerald-50"
    : colorClass.includes("orange")
    ? "bg-orange-50"
    : "bg-red-50";
  feedbackBar.textContent = text;
  feedbackBar.className = `mt-1 px-3 py-1.5 rounded-lg text-lg font-bold ${bgClass} ${colorClass} ${text ? "" : "h-6"}`;
  scanInput.classList.remove("flash-green", "flash-orange", "flash-red");
  void scanInput.offsetWidth;
  if (colorClass.includes("emerald")) scanInput.classList.add("flash-green");
  else if (colorClass.includes("orange")) scanInput.classList.add("flash-orange");
  else if (colorClass.includes("red")) scanInput.classList.add("flash-red");
}

// 格式錯誤只在本機發生，不寫入共用資料，但仍需與共用紀錄合併顯示，故另外保存一份本機清單
const LOCAL_LOG_MAX = 20;
let localErrorLines = []; // 最新在前
let sharedLogCache = [];  // 來自 Firestore data.log，依刷入順序（最舊在前）

function logLineLocal(text, colorClass) {
  localErrorLines.unshift({ text: `${formatLogTime(Date.now())} ${text}`, colorClass });
  localErrorLines = localErrorLines.slice(0, LOCAL_LOG_MAX);
  renderCombinedLog();
}

function formatLogTime(ts) {
  if (!ts) return "--:--:--";
  return new Date(ts).toLocaleTimeString("zh-TW", { hour12: false });
}

let showOnlyMineLog = false;

function renderCombinedLog() {
  const localHtml = localErrorLines.map((l) => `<div class="${l.colorClass}">${l.text}</div>`).join("");
  const visibleLog = showOnlyMineLog
    ? sharedLogCache.filter((entry) => entry.operator === operatorCode)
    : sharedLogCache;
  const sharedHtml = [...visibleLog]
    .reverse()
    .map((entry) => {
      const rawHtml = formatRawHtml(entry);
      const time = `<span class="text-slate-400">${formatLogTime(entry.ts)}</span>`;
      const tag = `<span class="text-slate-400">[${entry.operator || "未命名"}]</span>`;
      const batchSuffix = entry.batchCount > 1 ? `（過刷批次共 ${entry.batchCount} 張）` : "";
      if (entry.kind === "new") {
        return `<div class="text-emerald-600">${time} ${tag} ✓ ${rawHtml} 開新群組 #${entry.groupId}${batchSuffix}</div>`;
      }
      if (entry.kind === "merged") {
        const distanceText = entry.distance != null ? `（距離 ${entry.distance}）` : "";
        return `<div class="text-orange-500">${time} ${tag} → ${rawHtml} 併入群組 #${entry.groupId}${distanceText}${batchSuffix}</div>`;
      }
      return `<div class="text-orange-500">${time} ${tag} ↩ ${rawHtml} 重複略過${batchSuffix}</div>`;
    })
    .join("");
  scanLog.innerHTML = localHtml + sharedHtml;
}

// groupId -> 對應的卡片 DOM 節點，避免每次刷入都整批重繪（規模大時效能關鍵）
const scanGroupEls = new Map();

function buildGroupCardHtml(g, highlightSeq, isHighlighted) {
  const segments = rebuildSegments(g.items);
  const newestItem = isHighlighted && highlightSeq ? g.items.find((i) => i.seqStr === highlightSeq) : null;

  const allChipsHtml = g.items
    .map((i) => `<span class="px-2 py-0.5 rounded bg-slate-100 text-sm font-mono ${isHighlighted && i.seqStr === highlightSeq ? 'chip-latest' : ''}">${formatRawHtml(i)}</span>`)
    .join("");

  const newestChipHtml = newestItem
    ? `<div class="flex items-center gap-2">
        <span class="text-xs text-slate-400 whitespace-nowrap">最新刷入</span>
        <span class="px-2 py-0.5 rounded bg-slate-100 text-sm font-mono chip-latest">${formatRawHtml(newestItem)}</span>
      </div>`
    : "";

  return `
    <div class="flex justify-between items-center mb-2">
      <span class="font-mono font-medium text-slate-700 text-base">群組 #${g.id} · ${g.prefix}</span>
      <span class="text-indigo-600 font-semibold text-base">${g.items.length} 張</span>
    </div>
    <div class="flex gap-3">
      <div class="w-[420px] shrink-0 space-y-1 pr-3 border-r border-slate-200">
        ${segments.map(s => `<div class="text-sm font-mono text-slate-500 whitespace-nowrap">${formatRawHtml(s.from)} ~ ${formatRawHtml(s.to)}（${s.count} 張）</div>`).join("")}
      </div>

        <div class="flex items-start gap-3">
          ${newestChipHtml}
          <details>
            <summary class="cursor-pointer text-sm text-indigo-600 select-none whitespace-nowrap">展開全部 ${g.items.length} 張</summary>
            <div class="flex flex-wrap content-start gap-1 mt-2">
              ${allChipsHtml}
            </div>
          </details>
        </div>
      </div>
    </div>`;
}

function clearEmptyState() {
  const empty = scanGroupsView.querySelector("[data-empty-state]");
  if (empty) empty.remove();
}

/** 完整重繪（僅用於：排序、重置、初始載入等低頻操作，不用於逐筆刷入） */
function renderScanGroups() {
  scanGroupsView.innerHTML = "";
  scanGroupEls.clear();
  if (scanGroups.length === 0) {
    scanGroupsView.innerHTML = `<p data-empty-state class="text-base text-slate-400 text-center py-8">尚無群組，開始刷入序號</p>`;
    return;
  }
  scanGroups.forEach((g) => {
    const div = document.createElement("div");
    div.className = "border border-slate-200 rounded-lg p-3";
    div.id = `scan-group-${g.id}`;
    div.innerHTML = buildGroupCardHtml(g, null, false);
    scanGroupsView.appendChild(div);
    scanGroupEls.set(g.id, div);
  });
}

/** 單筆刷入後的局部更新：只重繪被異動的那張群組卡片，新群組插入頂部 */
function updateGroupCard(group, isNew, highlightSeq, shouldScroll) {
  clearEmptyState();

  let el = scanGroupEls.get(group.id);
  if (!el) {
    el = document.createElement("div");
    el.id = `scan-group-${group.id}`;
    scanGroupEls.set(group.id, el);
  }
  el.className = "border border-slate-200 rounded-lg p-3 group-card-highlight";
  el.innerHTML = buildGroupCardHtml(group, highlightSeq, true);

  if (isNew) {
    scanGroupsView.prepend(el);
  }

  if (shouldScroll) {
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  clearTimeout(el.__highlightTimer);
  el.__highlightTimer = setTimeout(() => el.classList.remove("group-card-highlight"), 1000);
}

function logBaseOf(parsed) {
  return {
    type: parsed.type,
    batchNo: parsed.batchNo,
    seqStr: parsed.seqStr,
    checksum: parsed.checksum,
    operator: parsed.scannedBy,
    ts: parsed.scannedAt,
  };
}

function pushLog(log, entry) {
  return [...(Array.isArray(log) ? log : []), entry].slice(-LOG_MAX_ENTRIES);
}

/** 樂觀更新本機鏡像，讓連續刷入（尤其是連號過刷）不用等伺服器回應就能決定下一筆的歸屬 */
function applyOptimisticLocalUpdate(parsed, outcome) {
  if (outcome.status === "duplicate") return;
  let group = scanGroups.find((g) => g.id === outcome.groupId);
  if (group) {
    if (!group.items.some((i) => i.raw === parsed.raw)) group.items.push(parsed);
  } else {
    scanGroups.push({ id: outcome.groupId, prefix: parsed.prefix, items: [parsed] });
  }
}

/**
 * 送出一筆已解析的序號：
 * 1. 用本機鏡像挑出「最可能」符合的候選群組（避免要讀取全部群組文件）
 * 2. Transaction 內用該候選群組的最新資料重新驗證是否仍然符合範圍/張數/容忍值限制
 * 3. 不符合就改為另開新群組——整個過程只讀寫「這一個群組文件 + seen 標記 + meta 文件」，
 *    文件大小不會隨著歷史刷入總數成長，避免再次撞上 Firestore 單一文件 1MB 上限
 */
async function performScan(parsed) {
  const scannedBy = operatorCode || "未命名";
  const scannedAt = Date.now();
  parsed.scannedBy = scannedBy;
  parsed.scannedAt = scannedAt;

  const eligibleGroups = scanGroups.filter((g) => {
    if (!g.items.length) return false;
    const firstSeq = g.items[0].seq;
    const withinRange = Math.abs(parsed.seq - firstSeq) <= maxGroupSize;
    const withinCount = g.items.length < maxGroupSize;
    return withinRange && withinCount;
  });
  const candidate = findBestGroup(parsed, eligibleGroups, tolerance);
  const candidateGroupId = candidate ? candidate.group.id : null;

  const seenRef = doc(seenCol, parsed.raw);
  const groupRef = candidateGroupId != null ? doc(groupsCol, String(candidateGroupId)) : null;

  const outcome = await runTransaction(db, async (tx) => {
    const seenSnap = await tx.get(seenRef);
    const metaSnap = await tx.get(sessionRef);
    const meta = ensureSessionDefaults(metaSnap.exists() ? metaSnap.data() : emptySessionData());

    if (seenSnap.exists()) {
      meta.log = pushLog(meta.log, { ...logBaseOf(parsed), kind: "duplicate" });
      tx.set(sessionRef, meta);
      return { status: "duplicate" };
    }

    const groupSnap = groupRef ? await tx.get(groupRef) : null;

    let finalGroupId = null;
    let isNew = false;
    let distance = null;

    if (groupSnap && groupSnap.exists()) {
      const group = groupSnap.data();
      const firstSeq = group.items[0].seq;
      const withinRange = Math.abs(parsed.seq - firstSeq) <= meta.maxGroupSize;
      const withinCount = group.items.length < meta.maxGroupSize;
      if (withinRange && withinCount) {
        const match = findBestGroup(parsed, [{ id: group.id, prefix: group.prefix, items: group.items }], meta.tolerance);
        if (match) {
          finalGroupId = group.id;
          distance = match.distance;
          tx.set(groupRef, { id: group.id, prefix: group.prefix, items: [...group.items, parsed] });
        }
      }
    }

    if (finalGroupId === null) {
      finalGroupId = meta.groupIdCounter;
      meta.groupIdCounter += 1;
      isNew = true;
      tx.set(doc(groupsCol, String(finalGroupId)), { id: finalGroupId, prefix: parsed.prefix, items: [parsed] });
    }

    meta.totalScanned += 1;
    meta.log = pushLog(meta.log, { ...logBaseOf(parsed), kind: isNew ? "new" : "merged", groupId: finalGroupId, distance });
    meta.updatedAt = serverTimestamp();
    tx.set(seenRef, { raw: parsed.raw });
    tx.set(sessionRef, meta);

    return { status: isNew ? "new" : "merged", groupId: finalGroupId, distance };
  });

  applyOptimisticLocalUpdate(parsed, outcome);
  return outcome;
}

/**
 * 連號頭尾過刷專用：一批「已知彼此連續」的序號一次送出，而不是一筆一筆各自開一次 transaction。
 * 因為整批都是連號，最終一定只會落在「最多一個既有群組 + 幾個新群組」，所以可以：
 *   1. 用本機鏡像挑一次候選既有群組
 *   2. 在同一個 transaction 內讀完 meta + 候選群組 + 這一批所有 seen 標記
 *   3. 依範圍/張數上限把這批序號分配好（先塞滿既有群組剩餘空間，超出的部分切成新群組)
 *   4. 一次寫完，不必每張各自來回一次 Firestore——這樣寫入次數大幅減少，也不影響刷入結果的即時同步
 * 一次呼叫的張數上限請由呼叫端控制（BULK_CHUNK_SIZE），避免單一 transaction 觸碰太多文件。
 */
async function performBulkScan(items) {
  const scannedBy = operatorCode || "未命名";
  const scannedAt = Date.now();
  items.forEach((it) => {
    it.scannedBy = scannedBy;
    it.scannedAt = scannedAt;
  });

  const firstItem = items[0];
  const eligibleGroups = scanGroups.filter((g) => {
    if (!g.items.length) return false;
    const firstSeq = g.items[0].seq;
    const withinRange = Math.abs(firstItem.seq - firstSeq) <= maxGroupSize;
    const withinCount = g.items.length < maxGroupSize;
    return withinRange && withinCount;
  });
  const candidate = findBestGroup(firstItem, eligibleGroups, tolerance);
  const candidateGroupId = candidate ? candidate.group.id : null;
  const groupRef = candidateGroupId != null ? doc(groupsCol, String(candidateGroupId)) : null;

  const seenRefs = items.map((it) => doc(seenCol, it.raw));

  const result = await runTransaction(db, async (tx) => {
    // 所有讀取要在任何寫入之前完成
    const seenSnaps = [];
    for (const ref of seenRefs) seenSnaps.push(await tx.get(ref));
    const metaSnap = await tx.get(sessionRef);
    const meta = ensureSessionDefaults(metaSnap.exists() ? metaSnap.data() : emptySessionData());
    const groupSnap = groupRef ? await tx.get(groupRef) : null;

    const dupRawSet = new Set();
    seenSnaps.forEach((snap, i) => {
      if (snap.exists()) dupRawSet.add(items[i].raw);
    });
    const freshItems = items.filter((it) => !dupRawSet.has(it.raw));
    const dupCount = items.length - freshItems.length;

    const newGroups = []; // { groupId, count }
    const mergedGroups = []; // { groupId, count }
    let remaining = [...freshItems];

    // 先試著塞進候選的既有群組（受範圍與剩餘張數雙重限制）
    if (remaining.length && groupSnap && groupSnap.exists()) {
      const group = groupSnap.data();
      const firstSeq = group.items[0].seq;
      const spaceByCount = meta.maxGroupSize - group.items.length;
      let spaceByRange = 0;
      for (const it of remaining) {
        if (Math.abs(it.seq - firstSeq) <= meta.maxGroupSize) spaceByRange++;
        else break;
      }
      const takeCount = Math.max(0, Math.min(spaceByCount, spaceByRange));
      if (takeCount > 0) {
        const match = findBestGroup(remaining[0], [{ id: group.id, prefix: group.prefix, items: group.items }], meta.tolerance);
        if (match) {
          const chunk = remaining.slice(0, takeCount);
          remaining = remaining.slice(takeCount);
          tx.set(groupRef, { id: group.id, prefix: group.prefix, items: [...group.items, ...chunk] });
          mergedGroups.push({ groupId: group.id, count: chunk.length });
        }
      }
    }

    // 剩下的（沒有既有群組可併入，或超出剩餘空間）依範圍上限切成一個或多個新群組
    while (remaining.length) {
      const chunk = [remaining[0]];
      const firstSeq = remaining[0].seq;
      let i = 1;
      while (i < remaining.length && chunk.length < meta.maxGroupSize && remaining[i].seq - firstSeq <= meta.maxGroupSize) {
        chunk.push(remaining[i]);
        i++;
      }
      remaining = remaining.slice(chunk.length);

      const newId = meta.groupIdCounter;
      meta.groupIdCounter += 1;
      tx.set(doc(groupsCol, String(newId)), { id: newId, prefix: chunk[0].prefix, items: chunk });
      newGroups.push({ groupId: newId, count: chunk.length });
    }

    meta.totalScanned += freshItems.length;
    if (freshItems.length) {
      const last = freshItems[freshItems.length - 1];
      const summaryGroupId = mergedGroups.length ? mergedGroups[0].groupId : newGroups[newGroups.length - 1]?.groupId;
      meta.log = pushLog(meta.log, {
        ...logBaseOf(last),
        kind: mergedGroups.length && !newGroups.length ? "merged" : "new",
        groupId: summaryGroupId,
        distance: null,
        batchCount: freshItems.length,
      });
    }
    if (dupCount) {
      meta.log = pushLog(meta.log, { ...logBaseOf(items[items.length - 1]), kind: "duplicate", batchCount: dupCount });
    }
    meta.updatedAt = serverTimestamp();

    items.forEach((it) => tx.set(doc(seenCol, it.raw), { raw: it.raw }));
    tx.set(sessionRef, meta);

    return { newGroups, mergedGroups, dupCount, freshItems };
  });

  // 樂觀更新本機鏡像：依照 transaction 回傳的分配結果，把這批序號（已排除重複的）各自放進對應的群組
  let cursor = 0;
  [...result.mergedGroups, ...result.newGroups].forEach(({ groupId, count }) => {
    const chunk = result.freshItems.slice(cursor, cursor + count);
    cursor += count;
    let group = scanGroups.find((g) => g.id === groupId);
    if (group) {
      chunk.forEach((it) => {
        if (!group.items.some((i) => i.raw === it.raw)) group.items.push(it);
      });
    } else if (chunk.length) {
      scanGroups.push({ id: groupId, prefix: chunk[0].prefix, items: [...chunk] });
    }
  });

  return result;
}

/** 送出一筆刷入：先在本機做格式檢查，通過後才呼叫 performScan 與所有使用者共同的資料比對、寫入 */
async function submitScan(raw) {
  const parsed = parseSerialLenient(raw);

  if (!parsed || parsed.error) {
    // 格式錯誤只影響本機統計，不需要寫入共用資料
    scanErrCount++;
    document.getElementById("scanErr").textContent = scanErrCount;
    setFeedback("✕ 格式錯誤", "text-red-600");
    logLineLocal(`✕ 格式錯誤：${raw}`, "text-red-600");
    return;
  }

  try {
    const result = await performScan(parsed);

    if (result.status === "duplicate") {
      setFeedback("↩ 重複略過", "text-red-600");
    } else if (result.status === "new") {
      setFeedback(`✓ 開新群組 #${result.groupId}`, "text-emerald-600");
    } else {
      setFeedback(`→ 併入群組 #${result.groupId}（距離 ${result.distance}）`, "text-orange-500");
    }
    // 群組畫面與刷入紀錄交給 onSnapshot 監聽器統一處理（自己與其他使用者都走同一條路徑）
  } catch (err) {
    setFeedback("✕ 送出失敗，請重試", "text-red-600");
    logLineLocal(`✕ 網路或伺服器錯誤：${raw}`, "text-red-600");
  }
}

function setRangeFeedback(text, colorClass) {
  const bgClass = colorClass.includes("emerald")
    ? "bg-emerald-50"
    : colorClass.includes("orange")
    ? "bg-orange-50"
    : colorClass.includes("indigo")
    ? "bg-indigo-50"
    : "bg-red-50";
  rangeFeedback.textContent = text;
  rangeFeedback.className = `mt-1 px-3 py-1.5 rounded-lg text-base font-bold min-h-[1.25rem] ${bgClass} ${colorClass}`;
}

/** 過刷專用的寬鬆解析：檢查碼（最後 -N）可以不輸入，不需要知道流水號後的檢查碼 */
function parseSerialLenient(raw) {
  if (raw == null) return null;
  const trimmed = raw.trim();
  if (trimmed === "") return null;
  const normalized = trimmed.toUpperCase().normalize("NFKC").replace(/\s+/g, "");
  // 15 碼 = 券種(1碼字母) + 號碼(14碼數字)；條碼實際會多讀到第 16 碼檢查碼（有無 "-" 分隔皆可，一律捨棄）
  const match = /^([A-Z])(\d{1,15})(?:-(\d))?$/.exec(normalized);
  if (!match) return { raw: trimmed, error: "格式不符" };
  const [, type, digitsRaw, dashChecksum] = match;
  let digits = digitsRaw;
  // 沒有用 "-" 分隔但條碼讀到第 16 碼（也就是這裡數字湊到 15 碼）時，最後一碼是檢查碼，自動捨棄只留前 14 碼
  if (dashChecksum === undefined && digits.length === 15) {
    digits = digits.slice(0, 14);
  }
  if (digits.length < 7 || digits.length > 14) {
    return { raw: trimmed, error: "格式不符" };
  }
  const seqStr = digits.slice(-7);
  const batchNo = digits.slice(0, -7);
  // 檢查碼一律捨棄，不論輸入時有沒有帶進來，只留下券種+批號+流水號（最高 15 碼）比對連號
  return {
    raw: `${type}${batchNo}${seqStr}`,
    type,
    batchNo,
    seq: parseInt(seqStr, 10),
    seqStr,
    checksum: null,
    prefix: type + batchNo,
  };
}

/** 連號頭尾過刷：只輸入起始與結束序號（可不含檢查碼），中間的連號由系統補齊後依序送出 */
async function submitRange() {
  const fromRaw = rangeFromInput.value.trim();
  const toRaw = rangeToInput.value.trim();
  if (!fromRaw || !toRaw) {
    setRangeFeedback("✕ 請輸入起始與結束序號", "text-red-600");
    return;
  }

  const fromParsed = parseSerialLenient(fromRaw);
  const toParsed = parseSerialLenient(toRaw);
  if (!fromParsed || fromParsed.error || !toParsed || toParsed.error) {
    setRangeFeedback("✕ 起始或結束序號格式不符", "text-red-600");
    return;
  }
  if (fromParsed.prefix !== toParsed.prefix) {
    setRangeFeedback("✕ 起始與結束序號前綴不同，無法過刷", "text-red-600");
    return;
  }

  let lo = fromParsed;
  let hi = toParsed;
  if (lo.seq > hi.seq) [lo, hi] = [hi, lo];
  const count = hi.seq - lo.seq + 1;

  if (count > 2000) {
    setRangeFeedback("✕ 範圍過大（超過 2000 張），請確認輸入", "text-red-600");
    return;
  }
  if (count > 100 && !confirm(`即將帶入 ${count} 張序號，中間未實際掃描的序號不會有檢查碼，確定繼續？`)) {
    return;
  }

  // 中間未實際掃描的序號無法得知真正的檢查碼，不加檢查碼與連字號，僅供連號比對使用
  const items = [];
  for (let seq = lo.seq; seq <= hi.seq; seq++) {
    if (seq === lo.seq) {
      items.push(lo);
    } else if (seq === hi.seq) {
      items.push(hi);
    } else {
      const seqStr = String(seq).padStart(lo.seqStr.length, "0");
      items.push({
        raw: `${lo.type}${lo.batchNo}${seqStr}`,
        type: lo.type,
        batchNo: lo.batchNo,
        seq,
        seqStr,
        checksum: null,
        prefix: lo.prefix,
      });
    }
  }

  rangeFillBtn.disabled = true;
  setRangeFeedback(`批次帶入中...（${count} 張）`, "text-indigo-600");

  // 一次交易最多處理這麼多張，避免單一 transaction 觸碰過多文件；正常範圍（幾十~幾百張）通常 1 次就完成
  const BULK_CHUNK_SIZE = 400;

  let newCount = 0;
  let mergedCount = 0;
  let dupCount = 0;
  const newGroupIds = new Set();
  const mergedGroupIds = new Set();

  try {
    for (let i = 0; i < items.length; i += BULK_CHUNK_SIZE) {
      const chunk = items.slice(i, i + BULK_CHUNK_SIZE);
      const outcome = await performBulkScan(chunk);
      dupCount += outcome.dupCount;
      outcome.newGroups.forEach(({ groupId, count }) => {
        newCount += count;
        newGroupIds.add(groupId);
      });
      outcome.mergedGroups.forEach(({ groupId, count }) => {
        mergedCount += count;
        mergedGroupIds.add(groupId);
      });
    }

    const parts = [];
    if (newCount) parts.push(`新增群組 #${[...newGroupIds].join("、#")}（${newCount} 張）`);
    if (mergedCount) parts.push(`併入群組 #${[...mergedGroupIds].join("、#")}（${mergedCount} 張）`);
    if (dupCount) parts.push(`重複略過 ${dupCount} 張`);
    setRangeFeedback(`✓ 完成：${parts.join("；")}`, "text-emerald-600");
    rangeFromInput.value = "";
    rangeToInput.value = "";
  } catch (err) {
    setRangeFeedback("✕ 送出失敗，請重試", "text-red-600");
  } finally {
    rangeFillBtn.disabled = false;
  }
}

// 條碼槍掃描流程：刷完起始序號自動跳到結束序號，刷完結束序號直接送出，不需要再按按鈕

function updateSummaryStats() {
  const segments = computeAllSegments();
  document.getElementById("scanGroupCount").textContent = scanGroups.length;
  document.getElementById("scanSegmentCount").textContent = segments.length;
  document.getElementById("scanCardTotal").textContent = scanTotalCount;
}

document.getElementById("sortScanBtn").addEventListener("click", async () => {
  // 依「相近序號」排序群組顯示順序：先按前綴，再按群組起始流水號排序；群組編號 (id) 維持不變
  // 排序結果寫成每個群組文件的 order 欄位，讓所有使用者看到一致的排序
  const sorted = [...scanGroups].sort((a, b) => {
    if (a.prefix !== b.prefix) return a.prefix < b.prefix ? -1 : 1;
    const aMin = Math.min(...a.items.map((i) => i.seq));
    const bMin = Math.min(...b.items.map((i) => i.seq));
    return aMin - bMin;
  });
  try {
    for (let i = 0; i < sorted.length; i += 400) {
      const batch = writeBatch(db);
      sorted.slice(i, i + 400).forEach((g, offset) => {
        batch.update(doc(groupsCol, String(g.id)), { order: i + offset });
      });
      await batch.commit();
    }
  } catch (err) {
    // 忽略失敗，使用者可再按一次
  }
});

      "序號": displaySeqs[idx],
      "群組編號": `#${s.groupId}`,

      "前綴": s.prefix,

      "張數": s.count,
      "刷入時間": s.lastScannedAt ? formatLogTime(s.lastScannedAt) : "",
      "人員代號": s.lastScannedBy || "",
    };
  });

  const sheet = XLSX.utils.json_to_sheet(rows);
  sheet["!cols"] = [
    { wch: 6 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 22 }, { wch: 22 }, { wch: 8 }, { wch: 12 }, { wch: 12 },
  ];

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, sheet, "整理結果");
  XLSX.writeFile(workbook, "voucher-groups.xlsx");
});

const RESET_PASSWORD = "8963";

/** 刪除子集合內所有文件（分批，每批最多 400 筆，避開 Firestore batch 500 筆上限） */
async function deleteAllDocsInCollection(colRef) {
  const snap = await getDocs(colRef);
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 400) {
    const batch = writeBatch(db);
    docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

document.getElementById("resetScanBtn").addEventListener("click", async () => {
  const input = prompt("此動作會清空所有人的刷入資料，請輸入重置密碼：");
  if (input === null) return;
  if (input !== RESET_PASSWORD) {
    alert("密碼錯誤，取消重置");
    return;
  }
  if (!confirm("確定要重置所有群組與統計嗎？此動作會影響所有正在使用的人員。")) return;

  scanErrCount = 0;
  document.getElementById("scanErr").textContent = 0;
  scanLog.innerHTML = "";

  const resetBtn = document.getElementById("resetScanBtn");
  const originalLabel = resetBtn.textContent;
  resetBtn.disabled = true;
  resetBtn.textContent = "重置中...";
  try {
    await deleteAllDocsInCollection(groupsCol);
    await deleteAllDocsInCollection(seenCol);
    await setDoc(sessionRef, emptySessionData());
  } catch (err) {
    alert("重置失敗，請重試");
  } finally {
    resetBtn.disabled = false;
    resetBtn.textContent = originalLabel;
  }
});

/* ---------- 整理結果分頁：全部刷完後，依連號整理為一組一列，供序號與實體同步核對 ---------- */
const scanSubTabGroupsBtn = document.getElementById("scanSubTabGroupsBtn");
const scanSubTabResultBtn = document.getElementById("scanSubTabResultBtn");
const scanSubTabQueryBtn = document.getElementById("scanSubTabQueryBtn");
const scanGroupsViewEl = document.getElementById("scanGroupsView");
const scanResultView = document.getElementById("scanResultView");
const scanResultBody = document.getElementById("scanResultBody");
const scanQueryView = document.getElementById("scanQueryView");
const queryInput = document.getElementById("queryInput");
const queryBtn = document.getElementById("queryBtn");
const queryResult = document.getElementById("queryResult");

function segmentKey(prefix, from, to) {
  return `${prefix}|${from.seqStr}|${to.seqStr}`;
}

function computeAllSegments() {
  const segments = [];
  scanGroups.forEach((g) => {
    rebuildSegments(g.items).forEach((s) => {
      // 找出這個連號區段實際包含哪些 item，取「最後刷入」的時間與人員代號代表這一段
      const segItems = g.items.filter((i) => i.seq >= s.from.seq && i.seq <= s.to.seq);
      let lastScannedAt = null;
      let lastScannedBy = null;
      segItems.forEach((i) => {
        if (i.scannedAt && (lastScannedAt === null || i.scannedAt > lastScannedAt)) {
          lastScannedAt = i.scannedAt;
          lastScannedBy = i.scannedBy || null;
        }
      });
      segments.push({
        groupId: g.id,
        prefix: g.prefix,
        from: s.from,
        to: s.to,
        count: s.count,
        lastScannedAt,
        lastScannedBy,
      });
    });
  });
  segments.sort((a, b) => {
    if (a.prefix !== b.prefix) return a.prefix < b.prefix ? -1 : 1;
    return a.from.seq - b.from.seq;
  });
  return segments;
}

/** 不同群組但序號恰好連號（前一段結束 = 這一段開始 - 1）視為同一批實體卡片，序號欄要顯示同一個編號 */
function computeDisplaySeqs(segments) {
  const seqs = [];
  let displaySeq = 0;
  let prevSegment = null;
  segments.forEach((s) => {
    const isContinuation = prevSegment && prevSegment.prefix === s.prefix && s.from.seq === prevSegment.to.seq + 1;
    if (!isContinuation) displaySeq += 1;
    seqs.push(displaySeq);
    prevSegment = s;
  });
  return seqs;
}

/* 整理結果的「跳轉到最新刷入」設定：可選只跳自己刷的、可自訂底色，底色會一直留著直到下一張刷入才轉移 */
let jumpOnlyMine = localStorage.getItem("voucherReturnsJumpOnlyMine") === "1";
let jumpHighlightColor = localStorage.getItem("voucherReturnsJumpColor") || "#a7f3d0";
let highlightedSegKey = null;

const jumpOnlyMineToggle = document.getElementById("jumpOnlyMineToggle");
const jumpHighlightColorInput = document.getElementById("jumpHighlightColorInput");
jumpOnlyMineToggle.checked = jumpOnlyMine;
jumpHighlightColorInput.value = jumpHighlightColor;

jumpOnlyMineToggle.addEventListener("change", () => {
  jumpOnlyMine = jumpOnlyMineToggle.checked;
  localStorage.setItem("voucherReturnsJumpOnlyMine", jumpOnlyMine ? "1" : "0");
});
jumpHighlightColorInput.addEventListener("input", () => {
  jumpHighlightColor = jumpHighlightColorInput.value;
  localStorage.setItem("voucherReturnsJumpColor", jumpHighlightColor);
  // 顏色改變時，若目前有高亮中的列，立刻套用新顏色
  if (highlightedSegKey) applyHighlightStyle();
});

function applyHighlightStyle() {
  scanResultBody.querySelectorAll("tr[data-seg-key]").forEach((row) => {
    row.style.backgroundColor = row.dataset.segKey === highlightedSegKey ? jumpHighlightColor : "";
  });
}

function renderResultView() {
  const segments = computeAllSegments();
  if (segments.length === 0) {
    scanResultBody.innerHTML = `<tr><td colspan="9" class="text-base text-slate-400 text-center py-8">尚無資料，請先於「群組列表」刷入序號</td></tr>`;
    return;
  }
  const displaySeqs = computeDisplaySeqs(segments);
  scanResultBody.innerHTML = segments.map((s, idx) => {
    const key = segmentKey(s.prefix, s.from, s.to);
    const checked = syncedSegments.get(key) ? "checked" : "";
    const scannedTime = s.lastScannedAt ? formatLogTime(s.lastScannedAt) : "-";
    const scannedBy = s.lastScannedBy || "-";
    const highlightStyle = key === highlightedSegKey ? ` style="background-color:${jumpHighlightColor};"` : "";
    return `
      <tr class="border-b border-slate-100 hover:bg-slate-50 align-middle" data-seg-key="${key}"${highlightStyle}>
        <td class="py-2 px-2 text-center text-emerald-600 font-bold">${displaySeqs[idx]}</td>
        <td class="py-2 px-2 text-center font-mono text-indigo-600 font-semibold">#${s.groupId}</td>
        <td class="py-2 px-2 text-center"><input type="checkbox" class="sync-checkbox w-5 h-5" ${checked} /></td>
        <td class="py-2 px-2 font-mono text-slate-600 whitespace-nowrap">${s.prefix}</td>
        <td class="py-2 px-2 font-mono whitespace-nowrap">${formatRawHtml(s.from)}</td>
        <td class="py-2 px-2 font-mono whitespace-nowrap">${formatRawHtml(s.to)}</td>
        <td class="py-2 px-2 text-right font-semibold text-indigo-600">${s.count}</td>
        <td class="py-2 px-2 text-slate-500 whitespace-nowrap">${scannedTime}</td>
        <td class="py-2 px-2 text-slate-500 whitespace-nowrap">${scannedBy}</td>
      </tr>`;
  }).join("");
}

/** 刷入新序號時，若符合「只跳自己的」設定，更新要高亮/捲動到的那一列（底色會停留到下一張刷入才轉移） */
function updateHighlightTarget(target) {
  if (jumpOnlyMine && target.operator !== operatorCode) return;
  const segments = computeAllSegments();
  const seg = segments.find(
    (s) => s.prefix === target.prefix && target.seq >= s.from.seq && target.seq <= s.to.seq
  );
  if (seg) highlightedSegKey = segmentKey(seg.prefix, seg.from, seg.to);
}

function scrollToHighlightedRow() {
  if (!highlightedSegKey) return;
  const row = scanResultBody.querySelector(`tr[data-seg-key="${CSS.escape(highlightedSegKey)}"]`);
  if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
}

scanResultBody.addEventListener("change", (e) => {
  if (!e.target.classList.contains("sync-checkbox")) return;
  const row = e.target.closest("tr");
  const key = row.dataset.segKey;
  // 核對狀態透過 Firestore 陣列同步給所有使用者，畫面即時反映由 onSnapshot 處理
  updateDoc(sessionRef, {
    syncedSegments: e.target.checked ? arrayUnion(key) : arrayRemove(key),
  }).catch(() => {});
  row.classList.toggle("bg-emerald-50", e.target.checked);
});

function setSubTabActive(btn, active) {
  btn.classList.toggle("bg-indigo-50", active);
  btn.classList.toggle("text-indigo-600", active);
  btn.classList.toggle("text-slate-500", !active);
}

function switchScanSubTab(target) {
  scanGroupsViewEl.classList.toggle("hidden", target !== "groups");
  scanResultView.classList.toggle("hidden", target !== "result");
  scanQueryView.classList.toggle("hidden", target !== "query");
  setSubTabActive(scanSubTabGroupsBtn, target === "groups");
  setSubTabActive(scanSubTabResultBtn, target === "result");
  setSubTabActive(scanSubTabQueryBtn, target === "query");
  if (target === "result") {
    renderResultView();
    scrollToHighlightedRow();
  }
  if (target === "query") queryInput.focus();
}

scanSubTabGroupsBtn.addEventListener("click", () => switchScanSubTab("groups"));
scanSubTabResultBtn.addEventListener("click", () => switchScanSubTab("result"));
scanSubTabQueryBtn.addEventListener("click", () => switchScanSubTab("query"));

/** 過刷卡號查詢：輸入完整序號，查出目前歸屬哪個群組與連號區段 */
function runSerialQuery() {
  const raw = queryInput.value.trim();
  if (!raw) {
    queryResult.innerHTML = `<p class="text-slate-400">請輸入序號</p>`;
    return;
  }
  const parsed = parseSerialLenient(raw);
  if (!parsed || parsed.error) {
    queryResult.innerHTML = `<p class="text-red-600">✕ 格式不符：${raw}</p>`;
    return;
  }

  for (const g of scanGroups) {
    const item = g.items.find((i) => i.seq === parsed.seq && i.type === parsed.type && i.batchNo === parsed.batchNo);
    if (item) {
      const segments = rebuildSegments(g.items);
      const seg = segments.find((s) => parsed.seq >= s.from.seq && parsed.seq <= s.to.seq);
      queryResult.innerHTML = `
        <div class="border border-emerald-200 bg-emerald-50 rounded-lg p-4">
          <p class="text-emerald-700 font-semibold mb-1">✓ 找到了，屬於群組 #${g.id}（${g.prefix}）</p>
          <p class="text-slate-600">所在連號區段：${formatRawHtml(seg.from)} ~ ${formatRawHtml(seg.to)}（${seg.count} 張）</p>
          ${item.scannedBy ? `<p class="text-slate-400 mt-1">刷入時間：${formatLogTime(item.scannedAt)}　人員代號：${item.scannedBy}</p>` : ""}
        </div>`;
      return;
    }
  }

  queryResult.innerHTML = `<p class="text-red-600">✕ 查無此序號，尚未刷入任何群組</p>`;
}

queryBtn.addEventListener("click", runSerialQuery);
queryInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") runSerialQuery();
});

/* ---------- Firestore 即時同步：meta 文件（設定/統計/紀錄）與 groups 子集合（群組本體）分開監聽 ---------- */
onSnapshot(
  sessionRef,
  (snap) => {
    const data = ensureSessionDefaults(snap.exists() ? snap.data() : emptySessionData());

    // 容忍值：其他使用者調整過就同步過來（自己正在拖曳/輸入時不覆蓋）
    const toleranceFocused = document.activeElement === toleranceSlider || document.activeElement === toleranceValue;
    if (!toleranceFocused && data.tolerance !== tolerance) {
      applyingRemoteTolerance = true;
      setToleranceLocal(data.tolerance);
      applyingRemoteTolerance = false;
    }

    // 群組上限張數：其他使用者調整過就同步過來（自己正在拖曳/輸入時不覆蓋）
    const maxGroupSizeFocused = document.activeElement === maxGroupSizeSlider || document.activeElement === maxGroupSizeValue;
    if (!maxGroupSizeFocused && data.maxGroupSize !== maxGroupSize) {
      applyingRemoteMaxGroupSize = true;
      setMaxGroupSizeLocal(data.maxGroupSize);
      applyingRemoteMaxGroupSize = false;
    }

    scanTotalCount = data.totalScanned;
    document.getElementById("scanTotal").textContent = scanTotalCount;

    syncedSegments.clear();
    data.syncedSegments.forEach((key) => syncedSegments.set(key, true));

    sharedLogCache = data.log;
    renderCombinedLog();

    updateSummaryStats();
    if (!scanResultView.classList.contains("hidden")) renderResultView();

    syncStatus.textContent = snap.metadata.fromCache ? "離線快取" : "已同步";
    syncStatus.className = `text-sm px-2 py-1 rounded-full ${
      snap.metadata.fromCache ? "bg-amber-50 text-amber-600" : "bg-emerald-50 text-emerald-600"
    }`;
  },
  () => {
    syncStatus.textContent = "連線失敗";
    syncStatus.className = "text-sm px-2 py-1 rounded-full bg-red-50 text-red-600";
  }
);

let groupsInitialLoadDone = false;

onSnapshot(
  groupsCol,
  (snap) => {
    let latestScannedItem = null;

    snap.docChanges().forEach((change) => {
      const g = change.doc.data();

      if (change.type === "removed") {
        scanGroups = scanGroups.filter((x) => x.id !== g.id);
        const el = scanGroupEls.get(g.id);
        if (el) el.remove();
        scanGroupEls.delete(g.id);
        localGroupMeta.delete(g.id);
        return;
      }

      const prevMeta = localGroupMeta.get(g.id);
      const isTrulyNew = groupsInitialLoadDone && !prevMeta;
      const itemCountChanged = prevMeta && prevMeta.itemCount !== g.items.length;

      const idx = scanGroups.findIndex((x) => x.id === g.id);
      if (idx === -1) scanGroups.push(g);
      else scanGroups[idx] = g;

      if (groupsInitialLoadDone && (isTrulyNew || itemCountChanged)) {
        const lastItem = g.items[g.items.length - 1];
        updateGroupCard(g, isTrulyNew, lastItem ? lastItem.seqStr : null, false);
        if (lastItem) latestScannedItem = { seq: lastItem.seq, prefix: g.prefix, operator: lastItem.scannedBy || null };
      }
      localGroupMeta.set(g.id, { itemCount: g.items.length });
    });

    if (!groupsInitialLoadDone) {
      scanGroups.sort((a, b) => (a.order ?? a.id) - (b.order ?? b.id));
      renderScanGroups();
      groupsInitialLoadDone = true;
    } else if (scanGroups.length === 0) {
      // 重置後子集合清空，補上「尚無群組」的提示畫面
      renderScanGroups();
    }

    updateSummaryStats();
    if (latestScannedItem) updateHighlightTarget(latestScannedItem);
    if (!scanResultView.classList.contains("hidden")) {
      renderResultView();
      scrollToHighlightedRow();
    }
  },
  () => {
    syncStatus.textContent = "連線失敗";
    syncStatus.className = "text-sm px-2 py-1 rounded-full bg-red-50 text-red-600";
  }
);
</script>
