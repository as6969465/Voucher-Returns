<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>禮券退貨彙整平台 - 登入</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-100 to-slate-200">
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <div class="mx-auto w-14 h-14 rounded-xl bg-indigo-600 flex items-center justify-center mb-3">
        <span class="text-white text-2xl">🎟️</span>
      </div>
      <h1 class="text-xl font-bold text-slate-800">禮券退貨彙整平台</h1>
      <p class="text-sm text-slate-400 mt-1">Voucher Returns</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">帳號</label>
        <input id="userId" maxlength="15" type="text" required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
          placeholder="請輸入帳號" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1">密碼</label>
        <input id="password" maxlength="30" type="password" required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400"
          placeholder="請輸入密碼" />
      </div>

      <div id="errorMsg" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>

      <button id="loginBtn" type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-2.5 rounded-lg transition">
        登入
      </button>
    </form>

    <p class="text-xs text-slate-400 text-center mt-6">© 2026 禮券退貨彙整平台 · Demo 環境</p>
  </div>

<script>
// TODO: IT 工程師請在此串接後端 API 邏輯（正式環境請改為呼叫後端代理，勿於前端直接暴露帳密）
const AUTH_ENDPOINT = "https://eip.fme.com.tw/FMEIP/AasApi/CheckUserId";

const form = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const errorMsg = document.getElementById("errorMsg");

const ERROR_MESSAGES = {
  "100": "帳號或密碼錯誤",
  "200": "AD 認證錯誤",
  "998": "系統暫時無法使用，請稍後再試",
  "999": "系統發生錯誤，請聯絡管理員",
};

function showError(msg) {
  errorMsg.textContent = msg;
  errorMsg.classList.remove("hidden");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.classList.add("hidden");

  const userId = document.getElementById("userId").value.trim();
  const password = document.getElementById("password").value;

  loginBtn.disabled = true; // 防止重複提交
  loginBtn.textContent = "登入中...";

  try {
    // Demo 模式：後端 API 尚未串接時，使用預設帳密登入以便測試 UI
    // 正式串接時請改為呼叫 AUTH_ENDPOINT（見 fme-auth-api skill）
    if (window.__DEMO_MODE__ !== false) {
      const DEMO_USER_ID = "reyi";
      const DEMO_PASSWORD = "8963";
      if (userId === DEMO_USER_ID && password === DEMO_PASSWORD) {
        sessionStorage.setItem("voucherReturnsUser", userId);
        window.location.href = "app.html";
      } else {
        showError("帳號或密碼錯誤");
      }
      return;
    }

    const response = await fetch(AUTH_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ USER_ID: userId, PSW: password }),
    });
    const data = await response.json();
    const code = (data.MSG || "").split(" ")[0];

    if (code === "000") {
      sessionStorage.setItem("voucherReturnsUser", userId);
      window.location.href = "app.html";
    } else {
      showError(ERROR_MESSAGES[code] || "系統發生錯誤，請聯絡管理員");
    }
  } catch (err) {
    showError("系統暫時無法使用，請稍後再試");
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "登入";
  }
});
</script>
</body>
</html>
